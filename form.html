<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Feedback Form</title>
</head>

<body>
    <h1> Feedback Form</h1>


<form action="/submit" method="post">

    <fieldset>

    <label for="full name">Full Name:</label>
    <input type="text" id="full name" name="full name" placeholder="Enter your full name" required>

    <label for="email">Email address:</label>
    <input type="email" id="email" name="email" placeholder="Enter your email" required>

    <label for="password">Email address:</label>
    <input type="password" id="pasword" name="password" placeholder="Enter your password" required>

    </fieldset>

    <fieldset>

    <label for="feedback category">Enter your feedback here:</label>
    <select id="category" name="category" required></select>

    </fieldset>

    <fieldset>

        <label>
            <input type="radio" name="contact" value="email" checked>email
        </label>

        <label>
            <input type="radio" name="contact" value="phone" checked>phone
        </label>

    </fieldset>

    <fieldset>
        <label>
         <input type="checkbox" name="feature" value="updates">updates
        </label>
    </fieldset>

    <fieldset>
        <label for="commands">
            feedback
        </label>

        <textarea id="commands" placeholder="commands"></textarea>
    </fieldset>

    <button type="submit">Submit feedback</button>

    
</form>

</body>

</html>
