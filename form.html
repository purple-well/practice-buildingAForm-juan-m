<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Feedback Form</title>
</head>

<body>
    <h1>Feedback Form</h1>

    <form action="/submit" method="post">

        <fieldset>
            <legend>Personal Information</legend>

            <label for="full-name">Full Name:</label>
            <input type="text" id="full-name" name="full_name" placeholder="Enter your full name" required>

            <label for="email">Email address:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </fieldset>

        <fieldset>
            <legend>Feedback</legend>

            <label for="feedback-category">Enter your feedback here:</label>
            <select id="feedback-category" name="feedback_category" required>
                <option value="">Choose a category</option>
                <option value="bug">Bug Report</option>
                <option value="suggestion">Suggestion</option>
                <option value="question">Question</option>
            </select>
        </fieldset>

        <fieldset>
            <legend>Preferred Contact Method</legend>

            <label>
                <input type="radio" name="contact" value="email" checked> email
            </label>

            <label>
                <input type="radio" name="contact" value="phone"> phone
            </label>
        </fieldset>

        <fieldset>
            <legend>Receive Updates?</legend>
            <label>
                <input type="checkbox" name="receive_updates" value="yes"> Yes, please send me updates
            </label>
        </fieldset>

        <fieldset>
            <legend>Additional Feedback</legend>
            <label for="comments">Comments:</label>
            <textarea id="comments" name="comments" placeholder="Comments go here"></textarea>
        </fieldset>

        <button type="submit">Submit feedback</button>

    </form>

</body>

</html>
